name: build-buer-wrt

on:
  workflow_dispatch:
  push:
    branches: [ buer-wrt ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 腾出磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget \
            libelf-dev ecj fastjar java-propose-classpath subversion swig upx-ucl

      - name: 更新 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置
        run: |
          cp configs/buer-wrt.config .config
          make defconfig
          echo "=== 关键配置 ==="
          grep -E "tkproxy|argon|luci-compat|xray-core|ip-full|cmcc_xr30-nand" .config || true

      - name: 下载源码包
        run: make download -j8 || make download -j1 V=s

      - name: 编译
        run: make -j$(nproc) || make -j1 V=s

      - name: 产物列表
        run: ls -lh bin/targets/mediatek/filogic/ || true

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: buer-wrt-cmcc_xr30-nand
          if-no-files-found: error
          path: |
            bin/targets/mediatek/filogic/*sysupgrade*
            bin/targets/mediatek/filogic/*.manifest
